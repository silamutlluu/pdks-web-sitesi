<div class="login-container">
  <div class="login-box glass-panel">
    <div class="login-header">
      <div class="logo-circle">
        <i class="icon-lock"></i> <!-- Yer tutucu ikon -->
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h2>Smart PDKS Panel</h2>
      <p>Yönetim paneline hoş geldiniz</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Kullanıcı Adı</label>
        <div class="input-wrapper">
          <input type="text" id="username" formControlName="username" placeholder="admin" [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Şifre</label>
        <div class="input-wrapper">
          <input type="password" id="password" formControlName="password" placeholder="••••••••" [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox">
          <span>Beni Hatırla</span>
        </label>
        <a href="#" class="forgot-pwd">Şifremi Unuttum</a>
      </div>

      <div *ngIf="errorMsg" class="error-banner">
        {{ errorMsg }}
      </div>

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Giriş Yap</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>
    </form>
  </div>
  
  <div class="background-decorations">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>
</div>
